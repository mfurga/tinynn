[project]
name = "tinynn"
version = "0.0.1"
description = "Tiny neural network library with automatic differentiation"
authors = [{ name = "Mateusz Furga" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.0.0,<3.0.0"]

[dependency-groups]
lint = [
    "ruff>=0.12.0",
]
test = ["pytest>=8.2,<9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
ignore_missing_imports = false
exclude = ["build", "tests"]

[tool.ruff]
line-length = 90
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "S",    # bandit
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]

ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

